<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffcf4">
<title>Coin Flip — Leave it to chance</title>
<style>
:root{color-scheme:light;--paper:#fffcf4;--ink:#171716;--gold:#f6bc35}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;text-align:center}
main{height:100svh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;justify-items:center;align-items:center;padding:20px 20px 38px;overflow:hidden}
h1{font-size:clamp(36px,6vw,90px);letter-spacing:-.055em;line-height:1.1;margin:0;font-weight:900} .subtitle{font-size:clamp(17px,2.5vw,27px);font-weight:600;color:#73716c;margin:12px 0 25px}
.stage{position:relative;width:min(560px,88vw);height:100%;min-height:0;display:grid;place-items:center;perspective:1200px}
.coin{height:min(85%,476px,74.8vw);aspect-ratio:1;position:relative;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;background:linear-gradient(135deg,#fff3a0 1%,#ffd75d 30%,#f5b627 67%,#d88b13);border:5px solid #ffe58b;box-shadow:0 7px 0 #bc7c16,inset 0 0 0 13px #f6c448,inset 0 0 0 16px #c98d1f,inset 0 0 0 19px #ffe58b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a96909;text-shadow:0 2px 0 #ffe694;gap:8px}
.face:after{content:"";position:absolute;inset:11%;border:2px solid #ffdf78;border-radius:50%;box-shadow:0 -2px 0 #d89423;pointer-events:none}
.back{transform:rotateY(180deg)}.emblem{width:46%;height:46%;filter:drop-shadow(0 3px 0 #b9760d);fill:#ffe57a;stroke:#d7961a;stroke-width:1.4}.back .emblem{fill:#ffe57a}
.face span{font-size:clamp(23px,4vw,39px);font-weight:850;letter-spacing:.12em;z-index:1}
.shadow{position:absolute;bottom:2%;width:78%;height:25px;border-radius:50%;background:#efab65;filter:blur(17px);opacity:.5;z-index:-1}
.spark{position:absolute;width:34px;height:45px;background:#ff927a;clip-path:polygon(50% 0,64% 35%,100% 50%,64% 65%,50% 100%,36% 65%,0 50%,36% 35%)}
.s1{left:0;top:20%;transform:rotate(-8deg)}.s2{right:0;top:24%;background:#b09ae2;width:28px;height:38px}.s3{left:0;bottom:21%;background:#b09ae2;width:22px;height:29px}.s4{right:0;top:42%;width:19px;height:26px}
#result{font-size:clamp(23px,3vw,33px);font-weight:800;margin:6px 0 23px;min-height:1.5em;letter-spacing:-.03em}
button{font:750 24px/1.2 system-ui,sans-serif;border:0;border-radius:100px;background:linear-gradient(#2d2d2b,#111110);color:white;min-width:360px;padding:22px 40px;cursor:pointer;box-shadow:0 4px 0 #00000018;display:flex;align-items:center;justify-content:center;gap:17px;transition:transform .15s,box-shadow .15s}
button svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}button:hover{transform:translateY(-3px);box-shadow:0 8px 0 #00000013}button:active{transform:translateY(1px)}button:focus-visible{outline:4px solid #9c7cdd;outline-offset:6px}button:disabled{cursor:wait;opacity:.7;transform:none}
.hint{font-size:14px;color:#77756e;margin:20px 0 0}footer{position:fixed;bottom:14px;right:20px;color:#817e76;font-size:11px}
.confetti{position:fixed;left:50%;top:48%;width:10px;height:16px;pointer-events:none;z-index:3;animation:burst 1.25s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
h1{font-size:clamp(30px,min(6vw,8dvh),90px)}
.subtitle{margin:10px 0 12px}
#result{margin:6px 0 14px}
.hint{margin-top:14px}
@media(max-width:550px){h1{max-width:350px}button{min-width:250px;padding:18px 35px}footer{right:12px;bottom:10px}}
@media(max-height:550px){main{padding-top:10px;padding-bottom:25px}h1{font-size:clamp(24px,7dvh,38px)}.subtitle{font-size:15px;margin:4px 0}.face span{font-size:clamp(12px,4dvh,23px)}#result{font-size:20px;min-height:1.2em;margin:3px 0 7px}button{font-size:19px;padding:10px 30px;min-width:220px}.hint{font-size:12px;margin-top:7px}footer{font-size:9px;bottom:6px}}
@media(prefers-reduced-motion:reduce){button{transition:none}.confetti{display:none}}
</style>
</head>
<body>
<main>
<h1>Leave it to chance.</h1>
<p class="subtitle">One coin. Two possibilities.</p>
<div class="stage" aria-hidden="true">
<div class="shadow"></div><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
<div class="coin" id="coin">
<div class="face"><svg class="emblem" viewBox="0 0 100 100"><path d="M50 3Q57 43 97 50Q57 57 50 97Q43 57 3 50Q43 43 50 3Z"/></svg><span>HEADS</span></div>
<div class="face back"><svg class="emblem" viewBox="0 0 100 100"><path d="M69 8A43 43 0 1 0 92 69A37 37 0 0 1 69 8Z"/></svg><span>TAILS</span></div>
</div>
</div>
<p id="result" role="status" aria-live="polite">Ready when you are.</p>
<button id="flip" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 7a8 8 0 0 1 13.8-1L20 9M4 15l1.1 3A8 8 0 0 0 18.9 17"/></svg><span>Flip coin</span></button>
<p class="hint">Press Space to flip</p>
</main>
<footer>v1.0.1 · 2026-10-27</footer>
<script>
const coin = document.querySelector('#coin');
const button = document.querySelector('#flip');
const result = document.querySelector('#result');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let rotation = 0;
function celebrate() {
  if (reduced.matches) return;
  for (let i = 0; i < 42; i++) {
    const piece = document.createElement('i');
    piece.className = 'confetti';
    piece.style.cssText = `background:${['#eebc39','#ff927a','#b09ae2','#79bda3'][i % 4]};--x:${(Math.random()-.5)*Math.min(innerWidth,1000)}px;--y:${(Math.random()-.7)*700}px;--r:${Math.random()*900}deg;border-radius:${i%3===0?'50%':'2px'}`;
    document.body.append(piece);
    piece.addEventListener('animationend', () => piece.remove(), {once:true});
  }
}
async function flip() {
  if (button.disabled) return;
  button.disabled = true;
  result.textContent = 'Up in the air…';
  button.querySelector('span').textContent = 'Flipping…';
  const tails = crypto.getRandomValues(new Uint8Array(1))[0] & 1;
  const target = rotation + 1800 + ((tails * 180 - rotation % 360 + 360) % 360);
  const animation = coin.animate([
    {transform:`translateY(0) rotateY(${rotation}deg) rotateZ(0deg)`},
    {transform:`translateY(-55px) rotateY(${rotation+(target-rotation)*.48}deg) rotateZ(-12deg)`,offset:.45},
    {transform:`translateY(0) rotateY(${target}deg) rotateZ(0deg)`}
  ], {duration:reduced.matches?100:1550,easing:'cubic-bezier(.2,.65,.25,1)',fill:'forwards'});
  await animation.finished;
  rotation = target % 360;
  coin.style.transform = `rotateY(${rotation}deg)`;
  animation.cancel();
  result.textContent = tails ? 'Tails!' : 'Heads!';
  button.querySelector('span').textContent = 'Flip coin';
  button.disabled = false;
  celebrate();
}
button.addEventListener('click', flip);
document.addEventListener('keydown', event => {
  if (event.code === 'Space' && !event.repeat && event.target !== button && !['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)) {
    event.preventDefault();
    flip();
  }
});
</script>
</body>
</html>
