<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Random Member Wheel</title>
  <style>
    :root { color-scheme: dark; --bg:#070b18; --panel:#11182b; --line:#293451; --text:#f8fafc; --muted:#9ca3af; --accent:#22c55e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 50% 0,#172554 0,var(--bg) 48%); }
    main { width:min(1180px,94vw); margin:auto; padding:28px 0 40px; }
    h1 { margin:0; font-size:clamp(1.8rem,4vw,3rem); }
    .subtitle { margin:.35rem 0 1.5rem; color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(280px,390px) 1fr; gap:28px; align-items:start; }
    .panel { padding:20px; border:1px solid var(--line); border-radius:20px; background:color-mix(in srgb,var(--panel) 94%,transparent); box-shadow:0 20px 50px #0006; }
    .label-row { display:flex; justify-content:space-between; gap:12px; margin-bottom:10px; font-weight:700; }
    #count { color:#86efac; }
    textarea { width:100%; min-height:390px; resize:vertical; border:1px solid #3b496b; border-radius:12px; padding:14px; color:var(--text); background:#080d1b; font:1rem/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    textarea:focus { outline:3px solid #3b82f655; border-color:#60a5fa; }
    .hint { color:var(--muted); font-size:.88rem; margin:9px 0 0; }
    .wheel-area { display:grid; justify-items:center; gap:17px; }
    .wheel-wrap { position:relative; width:min(680px,88vw); aspect-ratio:1; filter:drop-shadow(0 18px 35px #0009); }
    canvas { display:block; width:100%; height:100%; border-radius:50%; transform:rotate(0deg); }
    .pointer { position:absolute; z-index:2; top:50%; right:-2px; width:0; height:0; transform:translateY(-50%); border-top:21px solid transparent; border-bottom:21px solid transparent; border-right:45px solid #fff; filter:drop-shadow(0 3px 3px #0008); }
    .hub { position:absolute; inset:50% auto auto 50%; width:15%; aspect-ratio:1; transform:translate(-50%,-50%); border:7px solid #fff; border-radius:50%; background:#111827; box-shadow:0 3px 14px #000a; }
    button { border:0; border-radius:999px; padding:14px 34px; color:#04130a; background:linear-gradient(135deg,#86efac,var(--accent)); font-size:1.1rem; font-weight:900; cursor:pointer; box-shadow:0 8px 25px #22c55e44; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:disabled { cursor:not-allowed; opacity:.55; transform:none; }
    #status { min-height:2.5rem; margin:0; text-align:center; font-size:clamp(1.1rem,3vw,1.65rem); font-weight:800; }
    #status.winner { color:#fde047; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:820px) { main{padding-top:18px}.layout{grid-template-columns:1fr}.panel{order:2}textarea{min-height:240px}.wheel-area{order:1}.wheel-wrap{width:min(620px,86vw)} }
  </style>
</head>
<body>
  <main>
    <h1>Random Member Wheel</h1>
    <p class="subtitle">Add as many choices as you want. Every spin lasts 5 seconds.</p>
    <div class="layout">
      <section class="panel" aria-labelledby="entries-label">
        <div class="label-row"><label id="entries-label" for="entries">Members / choices</label><span id="count">0 total</span></div>
        <textarea id="entries" spellcheck="false" placeholder="Enter one choice per line">1
2
3
4</textarea>
        <p class="hint">One entry per line. Blank lines are ignored; duplicate entries remain separate chances.</p>
      </section>
      <section class="wheel-area" aria-label="Prize wheel">
        <div class="wheel-wrap">
          <canvas id="wheel" width="1000" height="1000"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <div class="hub" aria-hidden="true"></div>
        </div>
        <button id="spin" type="button">Spin the wheel</button>
        <p id="status" aria-live="polite">Ready to spin</p>
      </section>
    </div>
  </main>
  <script>
    const entriesBox = document.querySelector('#entries');
    const count = document.querySelector('#count');
    const canvas = document.querySelector('#wheel');
    const ctx = canvas.getContext('2d');
    const spinButton = document.querySelector('#spin');
    const status = document.querySelector('#status');
    let entries = [];
    let rotation = 0;
    let spinning = false;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];

    function getEntries() { return entriesBox.value.split(/\r?\n/).map(value => value.trim()).filter(Boolean); }
    function secureRandom(max) {
      if (max <= 1) return 0;
      const limit = Math.floor(0x100000000 / max) * max;
      const value = new Uint32Array(1);
      do crypto.getRandomValues(value); while (value[0] >= limit);
      return value[0] % max;
    }
    function fitText(text, maxWidth, startingSize) {
      let output = text, size = startingSize;
      ctx.font = `700 ${size}px system-ui`;
      while (ctx.measureText(output).width > maxWidth && output.length > 3) { output = output.slice(0,-2) + '…'; }
      return output;
    }
    function drawWheel() {
      entries = getEntries();
      count.textContent = `${entries.length.toLocaleString()} total`;
      spinButton.disabled = spinning || entries.length < 2;
      const center = canvas.width / 2, radius = center - 15;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if (!entries.length) return;
      const slice = Math.PI * 2 / entries.length;
      entries.forEach((name,index) => {
        const start = index * slice - Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(center,center); ctx.arc(center,center,radius,start,start+slice); ctx.closePath();
        ctx.fillStyle = colors[index % colors.length]; ctx.fill(); ctx.strokeStyle = '#ffffff77'; ctx.lineWidth = entries.length > 120 ? .5 : 2; ctx.stroke();
        if (entries.length <= 150) {
          ctx.save(); ctx.translate(center,center); ctx.rotate(start + slice/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
          const fontSize = Math.max(13,Math.min(42,650/entries.length+18));
          ctx.shadowColor='#000'; ctx.shadowBlur=4; ctx.font=`700 ${fontSize}px system-ui`;
          ctx.fillText(fitText(name,radius*.62,fontSize),radius-34,0); ctx.restore();
        }
      });
      ctx.beginPath(); ctx.arc(center,center,radius,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.lineWidth=12; ctx.stroke();
    }
    function spin() {
      if (spinning || entries.length < 2) return;
      spinning = true; spinButton.disabled = true; entriesBox.disabled = true;
      status.className=''; status.textContent='Spinning… 5';
      const winnerIndex = secureRandom(entries.length);
      const sliceDegrees = 360 / entries.length;
      const current = ((rotation % 360) + 360) % 360;
      const desired = (90 - (winnerIndex + .5) * sliceDegrees + 360) % 360;
      const delta = (desired - current + 360) % 360;
      rotation += 360 * 8 + delta;
      canvas.style.transition='transform 5s cubic-bezier(.10,.63,.08,1)';
      canvas.style.transform=`rotate(${rotation}deg)`;
      let remaining=5;
      const timer=setInterval(() => { remaining--; if(remaining>0) status.textContent=`Spinning… ${remaining}`; },1000);
      setTimeout(() => {
        clearInterval(timer); spinning=false; entriesBox.disabled=false; spinButton.disabled=false;
        status.className='winner'; status.textContent=`Winner: ${entries[winnerIndex]} 🎉`;
      },5000);
    }
    entriesBox.addEventListener('input',() => { if(!spinning) { status.className=''; status.textContent='Ready to spin'; drawWheel(); } });
    spinButton.addEventListener('click',spin);
    drawWheel();
  </script>
</body>
</html>
