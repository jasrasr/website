<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768" role="img" aria-labelledby="title desc">
  <title id="title">TV Binge Board desktop dashboard screenshot</title>
  <desc id="desc">Mock wide PWA screenshot showing the TV Binge Board dashboard, watch progress cards, and import tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
