<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">TV Binge Board mobile search and import screenshot</title>
  <desc id="desc">Mock mobile PWA screenshot showing search, manual add, CSV import, and screenshot upload on one page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.62" stop-color="#15285f"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="34" fill="url(#bg)"/>
  <rect x="16" y="24" width="358" height="796" rx="28" fill="#0f172a" opacity="0.86"/>
  <text x="32" y="64" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800">TV Binge Board</text>
  <text x="306" y="64" fill="#a7b0c2" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">rev 1.5.7</text>
  <text x="32" y="112" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="800">Search / Add</text>
  <rect x="32" y="136" width="326" height="58" rx="18" fill="#020617" stroke="#334155"/>
  <text x="52" y="171" fill="#94a3b8" font-family="system-ui" font-size="18">Search TMDB...</text>
  <rect x="32" y="208" width="142" height="44" rx="18" fill="#2563eb"/>
  <text x="63" y="236" fill="#fff" font-family="system-ui" font-size="16" font-weight="800">Search</text>
  <rect x="190" y="208" width="168" height="44" rx="18" fill="#1f2937" stroke="#334155"/>
  <text x="215" y="236" fill="#d1d5db" font-family="system-ui" font-size="16" font-weight="800">Manual add</text>
  <g filter="url(#shadow)">
    <rect x="32" y="280" width="326" height="118" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="48" y="300" width="58" height="76" rx="10" fill="#1e3a8a"/>
    <polygon points="68,322 68,354 93,338" fill="#93c5fd"/>
    <text x="124" y="314" fill="#f8fafc" font-family="system-ui" font-size="18" font-weight="800">Add with metadata</text>
    <text x="124" y="340" fill="#94a3b8" font-family="system-ui" font-size="13">Posters, years, seasons, episodes</text>
    <rect x="124" y="356" width="132" height="30" rx="15" fill="#2563eb"/>
    <text x="146" y="376" fill="#fff" font-family="system-ui" font-size="13" font-weight="800">Add to list</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="32" y="422" width="326" height="132" rx="20" fill="#111827" stroke="#334155"/>
    <text x="52" y="456" fill="#f8fafc" font-family="system-ui" font-size="21" font-weight="800">Import files</text>
    <text x="52" y="482" fill="#94a3b8" font-family="system-ui" font-size="14">CSV or JSON import review</text>
    <rect x="52" y="504" width="132" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="78" y="526" fill="#e5e7eb" font-family="system-ui" font-size="13" font-weight="800">Choose file</text>
    <rect x="198" y="504" width="132" height="34" rx="17" fill="#2563eb"/>
    <text x="231" y="526" fill="#fff" font-family="system-ui" font-size="13" font-weight="800">Upload</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="32" y="576" width="326" height="132" rx="20" fill="#111827" stroke="#334155"/>
    <text x="52" y="610" fill="#f8fafc" font-family="system-ui" font-size="21" font-weight="800">Screenshot import</text>
    <text x="52" y="636" fill="#94a3b8" font-family="system-ui" font-size="14">AI/OCR turns screenshots into guesses</text>
    <rect x="52" y="658" width="132" height="34" rx="17" fill="#1f2937" stroke="#475569"/>
    <text x="76" y="680" fill="#e5e7eb" font-family="system-ui" font-size="13" font-weight="800">Choose image</text>
    <rect x="198" y="658" width="132" height="34" rx="17" fill="#22c55e"/>
    <text x="229" y="680" fill="#052e16" font-family="system-ui" font-size="13" font-weight="900">Process</text>
  </g>
  <rect x="32" y="742" width="326" height="58" rx="24" fill="#111827" stroke="#334155"/>
  <text x="58" y="778" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="800">Home</text>
  <text x="126" y="778" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="800">Search</text>
  <text x="207" y="778" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="800">List</text>
  <text x="270" y="778" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="800">Import</text>
</svg>
