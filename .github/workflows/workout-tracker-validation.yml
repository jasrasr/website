# File Name: workout-tracker-validation.yml
# Author: Jason Lamb (with help from ChatGPT)
# Description: Validate PHP, JavaScript and preservation of Workout Tracker records.
# Revision: 1.6.0
# Created Date: 2026-10-22
# Modified Date: 2026-10-27
# Changelog: 1.6.0 - Test multi-photo persistence and global remember-me session lifetime. 1.5.0 - Validate seven-day and since-first attendance, weekday streaks, mobile card rendering. 1.4.0 - Run BPM parsing, input-validation and legacy-data isolation regression tests. 1.3.0 - Verify mobile detail-view DOM and private photo URLs. 1.2.0 - Test user-bound image access, backup ZIP, and read-only storage. 1.1.0 - Validate optional measurements, legacy-safe set edits and new advanced UI tests. 1.0.1 - Run DOM-backed Edit button regression test to catch empty CSS class exceptions. 1.0.0 - Run parser and lossless edit regression tests on pull requests.
name: Workout Tracker validation
on:
  pull_request:
    paths:
      - 'workout-tracker/**'
      - '.github/workflows/workout-tracker-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enable ZIP support for archive verification
        run: |
          if ! php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-zip
          fi
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive is required to test backup contents.\n"); exit(1); }'
      - name: Validate PHP code
        run: |
          php -v
          php -l workout-tracker/index.php
          php -l workout-tracker/photo.php
          php -l workout-tracker/photo-upload.php
          php -l workout-tracker/tests/photo-upload.test.php
          php -l 1-Framework/modules/Authentication/PasswordSession.php
          php -l user-management/src/Auth.php
          php -l user-management/index.php
          php -l workout-tracker/backup.php
          php -l workout-tracker/tests/photo-backup.test.php
          php -l workout-tracker/tests/heart-rate.test.php
          php -l workout-tracker/entries.php
          php -l workout-tracker/measurements.php
          php -l workout-tracker/tests/measurements.test.php
          php -l workout-tracker/parse.php
          php -l workout-tracker/tests/edit.test.php
          php -l workout-tracker/tests/parse.test.php
      - name: Verify parser and preservation tests
        run: |
          php workout-tracker/tests/parse.test.php
          php workout-tracker/tests/edit.test.php
          php workout-tracker/tests/measurements.test.php
          php workout-tracker/tests/photo-backup.test.php
          php workout-tracker/tests/photo-upload.test.php
          php workout-tracker/tests/heart-rate.test.php
      - name: Verify JavaScript syntax and Edit button behavior
        run: |
          node --check workout-tracker/app.js
          node --check workout-tracker/attendance.js
          node --check workout-tracker/tests/attendance.test.cjs
          node --check workout-tracker/tests/attendance-ui.test.cjs
          node workout-tracker/tests/attendance.test.cjs
          node workout-tracker/tests/attendance-ui.test.cjs
          node --check workout-tracker/tests/workout-detail.test.cjs
          node workout-tracker/tests/workout-detail.test.cjs
          node --check workout-tracker/advanced.js
          node --check workout-tracker/tests/advanced.test.cjs
          node workout-tracker/tests/advanced.test.cjs
          node --check workout-tracker/tests/edit-button.test.cjs
          node workout-tracker/tests/edit-button.test.cjs
      - name: Verify long-lived login is opt-in and revocable
        run: node --test user-management/tests/remember.test.cjs
