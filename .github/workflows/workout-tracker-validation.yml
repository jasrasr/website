# File Name: workout-tracker-validation.yml
# Author: Jason Lamb (with help from ChatGPT)
# Description: Validate PHP, JavaScript and preservation of Workout Tracker records.
# Revision: 1.0.0
# Created Date: 2026-10-22
# Modified Date: 2026-10-22
# Changelog: 1.0.0 - Run parser and lossless edit regression tests on pull requests.
name: Workout Tracker validation
on:
  pull_request:
    paths:
      - 'workout-tracker/**'
      - '.github/workflows/workout-tracker-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP code
        run: |
          php -v
          php -l workout-tracker/index.php
          php -l workout-tracker/entries.php
          php -l workout-tracker/parse.php
          php -l workout-tracker/tests/edit.test.php
          php -l workout-tracker/tests/parse.test.php
      - name: Verify parser and preservation tests
        run: |
          php workout-tracker/tests/parse.test.php
          php workout-tracker/tests/edit.test.php
      - name: Verify JavaScript syntax
        run: node --check workout-tracker/app.js
