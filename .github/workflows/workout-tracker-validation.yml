# File Name: workout-tracker-validation.yml
# Author: Jason Lamb (with help from ChatGPT)
# Description: Validate Workout Tracker PHP, JavaScript and regression tests.
# Revision: 1.0.0
# Created Date: 2026-10-21
# Modified Date: 2026-10-22
# Changelog: 1.0.0 - Run syntax, parser, quota and record-preservation checks.
name: Workout Tracker validation
on:
  pull_request:
    paths:
      - 'workout-tracker/**'
      - '1-Framework/**'
      - '.github/workflows/workout-tracker-validation.yml'
  push:
    branches: [main]
    paths:
      - 'workout-tracker/**'
      - '1-Framework/**'
      - '.github/workflows/workout-tracker-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP code
        run: find workout-tracker -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify parser and record-preservation regressions
        run: |
          php workout-tracker/tests/parse.test.php
          php workout-tracker/tests/edit.test.php
      - name: AI quotas, exemptions, concurrency and config deny patterns
        run: php workout-tracker/tests/ai-limits.test.php
