# Revision: 1.0.0 | Created/Modified: 2026-11-17
# Author: Jason Lamb with ChatGPT | Validate Kingdom Connections on PHP.
name: Kingdom Connections validation
on:
  pull_request:
    paths:
      - 'kingdom-connections/**'
      - '1-Framework/**'
      - 'user-management/**'
      - '.github/workflows/kingdom-connections-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated persistence tests
        run: |
          find kingdom-connections -name '*.php' -print0 | xargs -0 -n1 php -l
          php kingdom-connections/tests/directory.test.php
      - name: Public directory smoke check
        run: |
          php -S 127.0.0.1:8097 > /tmp/kingdom-php.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8097/kingdom-connections/ > /tmp/kingdom-page.html; then break; fi
            sleep 1
          done
          grep -q 'A community starts with a connection' /tmp/kingdom-page.html
          test "$(curl --silent --output /tmp/kingdom-missing.html --write-out '%{http_code}' 'http://127.0.0.1:8097/kingdom-connections/?id=missing')" = 404
          test ! -e kingdom-connections/storage/directory.json
