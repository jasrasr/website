# File Name     : .github/workflows/project-index.yml
# Author        : Jason Lamb (with help from ChatGPT)
# Description   : Validate generated project listings and open a sync PR when needed.
# Revision      : 1.0.1
# Created Date  : 2026-11-25
# Modified Date : 2026-11-25
# Changelog     :
#   Rev 1.0.1 - Republish repairs when the previous sync branch is already merged.
#   Rev 1.0.0 - Check project index changes and reconcile stale generated listings.
name: Project Index

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for unregistered app entry points
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          while IFS= read -r -d '' path; do
            if [[ "$path" =~ ^([a-zA-Z0-9_-]+)/(index\.php|index\.html)$ ]]; then
              project="${BASH_REMATCH[1]}"
              if [[ ! -f "$project/project.json" ]]; then
                echo "::warning file=$path::Add $project/project.json to include the app in the project index."
              fi
            fi
          done < <(git diff --diff-filter=A --name-only -z "$BASE_SHA" HEAD)
      - name: Check generated listings
        run: python3 .github/scripts/project-index.py --check

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-project-index
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate and update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/project-index
        run: |
          python3 .github/scripts/project-index.py
          if git diff --quiet -- README.md projects/index.html; then
            open_pr=$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$open_pr" ]]; then
              gh pr close "$open_pr"
            fi
            echo "Project index is current."
            exit 0
          fi

          git add -- README.md projects/index.html
          tree=$(git write-tree)
          parents=(-p HEAD)
          publish=true
          current=$(git ls-remote origin "refs/heads/$SYNC_BRANCH")
          if [[ -n "$current" ]]; then
            git fetch --no-tags origin "refs/heads/$SYNC_BRANCH"
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              parents+=(-p FETCH_HEAD)
              if [[ "$tree" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]]; then
                publish=false
              fi
            fi
          fi

          if [[ "$publish" == true ]]; then
            commit=$(git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree "$tree" "${parents[@]}" -m "Sync generated project indexes")
            git push origin "$commit:refs/heads/$SYNC_BRANCH"
          fi

          open_pr=$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$open_pr" ]]; then
            gh pr create --base main --head "$SYNC_BRANCH" --title 'Sync generated project indexes' \
              --body 'Regenerate the README project tables and Projects page tiles from the project.json files on main.'
          else
            echo "Sync pull request #$open_pr is open."
          fi
