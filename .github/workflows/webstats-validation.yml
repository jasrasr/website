name: Webstats validation
on:
  pull_request:
    paths: ['webstats-demo/**', 'webstats/**', '1-Framework/**', '.github/workflows/webstats-validation.yml']
  push:
    branches: [main]
    paths: ['webstats-demo/**', 'webstats/**', '1-Framework/**', '.github/workflows/webstats-validation.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find webstats webstats-demo 1-Framework -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tracker behavior
        run: node --test webstats/tests/tracker.test.cjs
      - name: Collector and dashboard HTTP tests
        run: node --test webstats/tests/server.test.cjs
      - name: First-run admin and forced password change
        run: node --test webstats/tests/first-run.test.cjs
      - name: Install Apache for runtime-file access check
        run: sudo apt-get update -qq && sudo apt-get install -y apache2
      - name: Deny direct access to runtime data
        run: node --test webstats/tests/data-access.test.cjs
