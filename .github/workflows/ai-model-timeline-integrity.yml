name: AI Model Timeline Integrity
on:
  pull_request:
    paths:
      - 'ai-model-timeline/**'
      - '.github/workflows/ai-model-timeline-integrity.yml'
  push:
    paths:
      - 'ai-model-timeline/**'
      - '.github/workflows/ai-model-timeline-integrity.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ai-model-timeline/scripts/validate.cjs
