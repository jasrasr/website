<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Grid — Access Denied</title><style>
:root{font-family:'Courier New',monospace;color:#b9d9ff;background:#061b60}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#123b93 0%,#09236d 62%,#04123d 100%)}.crt{min-height:100vh;padding:clamp(16px,4vw,55px);position:relative;overflow:hidden}.crt:after{content:'';pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(transparent 0 3px,#0002 4px 5px);opacity:.3}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.toolbar button{background:#183c86;border:1px solid #7ca7e9;color:#e2efff;padding:8px 12px;font:inherit;cursor:pointer}.toolbar button:hover{background:#3159a0}.hint{opacity:.75;font-size:13px}#screen{font-size:clamp(17px,2.8vw,38px);font-weight:bold;line-height:1.22;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 0 5px #8bc0ff80}.entry{display:flex;align-items:center;gap:12px;font-size:clamp(17px,2.8vw,38px);font-weight:bold}#cmd{min-width:0;flex:1;background:transparent;color:inherit;border:0;outline:none;font:inherit;caret-color:#d4ebff}#cmd:disabled{opacity:.4}.window{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,90vw);background:#f6f6f6;color:#111;border:2px solid #111;box-shadow:12px 12px 0 #0008;font-family:Arial,sans-serif}.window[hidden]{display:none}.titlebar{background:repeating-linear-gradient(0deg,#fff 0 2px,#222 3px 4px);border-bottom:2px solid #111;text-align:center;padding:5px}.titlebar span{background:#fff;padding:3px 16px;font-weight:bold}.character{min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px;text-align:center}.finger{font-size:100px;animation:wag .4s infinite alternate;transform-origin:bottom center}.face{font-size:90px}.caption{font-weight:bold;font-size:24px;margin-top:12px}@keyframes wag{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}.close{float:right;margin:7px;background:white;border:2px solid black;cursor:pointer}@media(prefers-reduced-motion:reduce){.finger{animation:none}}
</style></head><body><main class="crt"><div class="toolbar"><button id="demo">Auto demo</button><button id="reset">Reset</button><button id="sound" aria-pressed="true">Sound: On</button><span class="hint">Type a command and press Enter. Try: access security</span></div><div id="screen" aria-live="polite"></div><form class="entry" id="form"><span>&gt;</span><input id="cmd" autocomplete="off" autofocus spellcheck="false" aria-label="Terminal command"></form></main><section class="window" id="window" hidden role="dialog" aria-label="Security alert"><div class="titlebar"><span>THE KING</span></div><button class="close" id="close">×</button><div class="character"><div class="face">😏</div><div class="finger">☝️</div><div class="caption">YOU DIDN'T SAY THE MAGIC WORD!</div></div></section><script>
const screen=document.querySelector('#screen'),cmd=document.querySelector('#cmd'),win=document.querySelector('#window');let attempts=0,locked=false,sound=true,timers=[];const later=(fn,ms)=>{let t=setTimeout(fn,ms);timers.push(t)};function line(s=''){screen.textContent+=s+'\n';window.scrollTo(0,document.body.scrollHeight)}function speak(){if(!sound||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("You didn't say the magic word!");u.rate=1.15;u.pitch=1.4;speechSynthesis.speak(u)}function takeover(){locked=true;cmd.disabled=true;line('...and...');let i=0;function tick(){if(!locked)return;line("YOU DIDN'T SAY THE MAGIC WORD!");speak();if(++i===3)win.hidden=false;if(i<24)later(tick,550)}tick()}function run(command){if(locked)return;line('> '+command);if(!command.trim())return;attempts++;line('access: PERMISSION DENIED'+(attempts>=3?'...':''));if(attempts>=3)later(takeover,700)}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();run(cmd.value);cmd.value='' });function reset(){timers.forEach(clearTimeout);timers=[];if('speechSynthesis'in window)speechSynthesis.cancel();attempts=0;locked=false;screen.textContent='ready...\n';cmd.disabled=false;cmd.value='';win.hidden=true;cmd.focus()}document.querySelector('#reset').onclick=reset;document.querySelector('#close').onclick=()=>{win.hidden=true};document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent='Sound: '+(sound?'On':'Off');e.currentTarget.setAttribute('aria-pressed',String(sound))};document.querySelector('#demo').onclick=()=>{reset();['access security','access security grid','access main security grid'].forEach((s,i)=>later(()=>run(s),700+i*1300))};reset();
</script></body></html>
