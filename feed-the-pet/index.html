<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe5b5">
  <title>Feed the Pet</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="orders.css?v=5">
  <script src="game.js?v=6" defer></script>
</head>
<body>
  <main class="game" aria-labelledby="title">
    <header class="header">
      <div><p class="eyebrow">A little pet-care game</p><h1 id="title">Feed the Pet</h1></div>
      <button id="new-game" class="reset" type="button">New pet</button>
    </header>
    <div class="mode-picker" role="group" aria-label="Game controls">
      <button type="button" data-mode="free" aria-pressed="true">Free Feed</button>
      <button type="button" data-mode="orders" aria-pressed="false"><span aria-hidden="true">📋</span> Pet Orders</button>
      <button id="sound-toggle" type="button" aria-pressed="true">
        Sound <span aria-hidden="true">on</span>
      </button>
    </div>
    <section class="pet-picker" aria-label="Choose a pet"><p class="section-label">Who is hungry?</p><div id="pet-picker" class="pet-options"></div></section>
    <section class="play-area" aria-label="Feeding area">
      <div id="pet" class="pet" role="img" aria-label="Happy pet">🐶</div>
      <div class="speech" id="speech" aria-live="polite">Tap some food for me!</div>
      <div id="order-clues" class="order-clues" aria-hidden="true" hidden></div>
      <button id="repeat-order" class="repeat-order" type="button" hidden aria-label="Hear the order again">
        <span aria-hidden="true">🔊</span> Hear again
      </button>
      <div class="bowl" id="bowl" aria-hidden="true"><span class="bowl-icon">🥣</span></div>
      <p class="progress" id="progress" aria-live="polite">Food: 0 of 5</p>
      <p id="order-feedback" class="order-feedback" role="status"></p>
      <button id="next-order" class="reset next-order" type="button" hidden>
        <span class="next-icon" aria-hidden="true">▶</span> <span class="next-label">Next order</span>
      </button>
    </section>
    <section class="food-area" aria-label="Choose food"><p class="section-label">Pick a food</p><div id="food" class="food-options"></div></section>
    <section class="session-history" aria-labelledby="history-title">
      <h2 id="history-title">This session</h2>
      <p id="session-count" aria-live="polite">0 completed rounds</p>
      <ol id="session-list" aria-label="Completed rounds"></ol>
      <a href="/user-management/">Sign in to User Management</a>
    </section>
  </main>
</body>
</html>
